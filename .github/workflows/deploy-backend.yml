name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kyc-trueface-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/KYC.TrueFace.Core.API/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Copiar docker-compose para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'deploy/docker-compose.prod.yml'
          target: '/opt/kyc-trueface'
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: API_IMAGE,GHCR_USER,GHCR_PAT,POSTGRES_PASSWORD,SSO_KEY,APP_FRONTEND_URL
          script: |
            set -euo pipefail
            mkdir -p /opt/kyc-trueface
            cd /opt/kyc-trueface

            cat > .env <<EOF
            API_IMAGE=$API_IMAGE
            POSTGRES_USER=postgres
            POSTGRES_DB=appdb
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            SSO_KEY=$SSO_KEY
            SSO_ISSUER=KYC.TrueFace.Core.API
            SSO_AUDIENCE=KYC.TrueFace.Web.WebPartner
            APP_FRONTEND_URL=$APP_FRONTEND_URL
            EOF
            chmod 600 .env

            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -af --filter "until=72h"
        env:
          API_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SSO_KEY: ${{ secrets.SSO_KEY }}
          APP_FRONTEND_URL: ${{ secrets.APP_FRONTEND_URL }}
