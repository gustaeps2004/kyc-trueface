services:
  postgres:
    image: postgres:16-alpine
    container_name: kyc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ${API_IMAGE}
    container_name: kyc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-appdb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      App__FrontendUrl: ${APP_FRONTEND_URL}
      App__CorsName: DefaultCorsPolicy
      Sso__Issuer: ${SSO_ISSUER:-KYC.TrueFace.Core.API}
      Sso__Audience: ${SSO_AUDIENCE:-KYC.TrueFace.Web.WebPartner}
      Sso__Key: ${SSO_KEY}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Smtp__UseSsl: ${SMTP_USE_SSL}
      Onboarding__StoragePath: /var/kyc-trueface/onboarding
      Aws__Region: ${AWS_REGION}
      Aws__AccessKeyId: ${AWS_ACCESS_KEY_ID}
      Aws__SecretAccessKey: ${AWS_SECRET_ACCESS_KEY}
      Aws__Rekognition__SimilarityThreshold: ${AWS_REKOGNITION_SIMILARITY_THRESHOLD:-90}
    volumes:
      - onboarding_images:/var/kyc-trueface/onboarding
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: kyc-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  onboarding_images:
  caddy_data:
  caddy_config:
