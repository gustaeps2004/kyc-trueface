<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Face outline -->
  <circle cx="32" cy="28" r="18" stroke="#4FC3F7" stroke-width="2.5" fill="#0D1B2A"/>

  <!-- Eyes -->
  <circle cx="25" cy="25" r="2.5" fill="#4FC3F7"/>
  <circle cx="39" cy="25" r="2.5" fill="#4FC3F7"/>

  <!-- Nose bridge -->
  <path d="M32 27 L30 33 L34 33" stroke="#4FC3F7" stroke-width="1.5" stroke-linejoin="round" fill="none"/>

  <!-- Mouth -->
  <path d="M26 37 Q32 41 38 37" stroke="#4FC3F7" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Scan lines (horizontal, semi-transparent, covering face area) -->
  <rect x="14" y="20" width="36" height="1.5" fill="#00E5FF" opacity="0.25"/>
  <rect x="14" y="25" width="36" height="1.5" fill="#00E5FF" opacity="0.35"/>
  <rect x="14" y="30" width="36" height="1.5" fill="#00E5FF" opacity="0.25"/>
  <rect x="14" y="35" width="36" height="1.5" fill="#00E5FF" opacity="0.35"/>

  <!-- Active scan line (bright) -->
  <rect x="14" y="28" width="36" height="2" fill="#00E5FF" opacity="0.7"/>

  <!-- Corner brackets (biometric frame) -->
  <!-- Top-left -->
  <path d="M10 18 L10 10 L18 10" stroke="#4FC3F7" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Top-right -->
  <path d="M54 18 L54 10 L46 10" stroke="#4FC3F7" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Bottom-left -->
  <path d="M10 46 L10 54 L18 54" stroke="#4FC3F7" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Bottom-right -->
  <path d="M54 46 L54 54 L46 54" stroke="#4FC3F7" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
